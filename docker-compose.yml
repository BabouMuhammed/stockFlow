services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow_local
      POSTGRES_DB: stockflow
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockflow -d stockflow']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - stockflow_pgdata:/var/lib/postgresql/data
volumes:
  stockflow_pgdata:
